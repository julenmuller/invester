name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup do Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint do backend
        run: pnpm --filter @invester/api lint

      - name: Testes do backend
        run: pnpm --filter @invester/api test

      - name: Lint do frontend
        run: pnpm --filter @invester/web lint
