services:
  postgres:
    image: postgres:16-alpine
    container_name: invester-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invester
      POSTGRES_PASSWORD: invester
      POSTGRES_DB: invester
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invester"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: invester-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: invester-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://invester:invester@postgres:5432/invester?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-change-me}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-please-set-token}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres-data:
  redis-data:
